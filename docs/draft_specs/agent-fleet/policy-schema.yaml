#   hash_lines: 20
#   evidence_lines: 6
# prompting:
#   cooldown_seconds: 300
#   max_prompts_per_hour: 6
#   backlog_review_seconds: 21600
#   duty_seconds: 3600
#   review_seconds: 3600
#   stuck_input_ticks: 2
# tick_seconds: 600

[project]
name = "agentgen"
version = "1.0.0"
description = "Render the shared agent role sources in agent_sources/ into each target's native agent format."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "jinja2>=3.1.6,<4",
    "pyyaml>=6.0.2,<7",
]

[project.scripts]
agentgen = "agentgen.cli:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9"]
build-backend = "uv_build"

schema: 1
name: codex
application:
  name: Codex CLI
  checked: codex-cli 0.155.1
  evidence:
    - https://developers.openai.com/codex/subagents
    - https://developers.openai.com/codex/config-reference
  notes:
    - Discovers one TOML file per custom agent in ~/.codex/agents/ and .codex/agents/, and loads a symlinked agent file.
    - name, description, and developer_instructions are required; a writable role omits sandbox_mode so the child inherits the parent's sandbox.
    - sandbox_mode = "read-only" is host-enforced, but live overrides in the parent session, such as /permissions changes or --yolo, outrank it.
    - Whether web search stays available to a read-only custom agent is not yet verified.
    - There is no per-agent tool allowlist, and skills.config enables or disables skills by path rather than preloading them.
    - Without a model key the agent uses agents.default_subagent_model or the parent's model.
format: toml
template: codex.toml.j2
output: generated/codex/agents
noun: agent
model:
  key: model
readonly:
  render: native
  key: sandbox_mode
  value: read-only
tools:
  render: commented
  key: tools
  style: list
required_skills:
  render: commented
  key: skills
suggested_skills:
  render: instruction
overrides:
  model_reasoning_effort:
    type: enum
    values: [minimal, low, medium, high, xhigh]

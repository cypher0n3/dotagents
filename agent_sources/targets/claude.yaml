schema: 1
name: claude
application:
  name: Claude Code
  checked: Claude Code 2.1.282
  evidence:
    - https://code.claude.com/docs/en/sub-agents
    - docs/docs_standards/agent_authoring.md
  notes:
    - Enforces the tools allowlist and preloads the skills list, so it is the only target that carries both natively.
    - Has no readonly field; a read-only role is carried by an allowlist without Write, Edit, or NotebookEdit.
    - An allowlist that includes Bash leaves shell writes to host approvals.
format: markdown
template: claude.md.j2
output: agents
noun: agent
model:
  key: model
  inherit: inherit
alias_list:
  strong: [opus]
  standard: [sonnet]
  fast: [haiku]
readonly:
  render: tools
tools:
  render: native
  key: tools
  style: comma
required_skills:
  render: native
  key: skills
suggested_skills:
  render: instruction
presentation: [color]

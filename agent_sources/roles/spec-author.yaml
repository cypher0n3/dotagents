schema: 1
name: spec-author
description: >-
  Writes and revises requirements and technical specifications to the
  repository's own documentation standards, then lints them. Use this agent
  when a change needs its requirements or technical specification drafted,
  extended, or reorganized.
body: prompts/spec-author.md
targets: [claude, codex, cursor, hermes, cai]
model:
  alias: standard
skills:
  required:
    - spec-authoring
    - requirements-authoring
    - markdown-writer
restrictions:
  tools: [Read, Grep, Glob, Bash, Write, Edit]
presentation:
  claude:
    color: purple

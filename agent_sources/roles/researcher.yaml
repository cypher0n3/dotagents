schema: 1
name: researcher
description: >-
  Gathers facts from the repository, its documentation, and the web, and
  reports them with exact references, without making any changes. Use this
  agent when a question needs evidence collected from many files or sources
  before anyone decides what to do.
body: prompts/researcher.md
targets: [claude, codex, cursor, hermes, cai]
model:
  alias: standard
restrictions:
  readonly: true
  tools: [Read, Grep, Glob, Bash, WebFetch, WebSearch]
presentation:
  claude:
    color: blue

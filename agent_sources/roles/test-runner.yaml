schema: 1
name: test-runner
description: >-
  Runs a repository's tests, diagnoses each failure down to a root cause, and
  writes or repairs tests when the task calls for it. Use this agent when a
  change needs its tests run, when a failing or flaky test needs chasing down,
  or when existing code needs missing coverage.
body: prompts/test-runner.md
targets: [claude, codex, cursor, hermes, cai]
model:
  alias: standard
skills:
  required:
    - senior-developer
    - just-ci
restrictions:
  tools: [Read, Grep, Glob, Bash, Write, Edit, Skill]
presentation:
  claude:
    color: orange

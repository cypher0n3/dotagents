schema: 1
name: docs-writer
description: >-
  Writes, revises, and audits Markdown documentation against the conventions
  of the repository it is running in, and leaves every file it touches passing
  that repository's lint. Use this agent when a README, guide, or other
  project document needs drafting, restructuring, or correcting, and when
  existing documentation needs checking against the repository's own
  standards.
body: prompts/docs-writer.md
targets: [claude, codex, cursor, hermes, cai]
model:
  alias: standard
skills:
  required:
    - markdown-writer
restrictions:
  tools: [Read, Grep, Glob, Bash, Write, Edit, Skill]
presentation:
  claude:
    color: pink
